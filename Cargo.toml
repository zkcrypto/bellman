[workspace]
members = [
    ".",
    "groth16",
]

[package]
authors = [
    "Sean Bowe <ewillbefull@gmail.com>",
    "Jack Grigg <thestr4d@gmail.com>",
]
description = "zk-SNARK library"
readme = "README.md"
homepage = "https://github.com/zkcrypto/bellman"
license = "MIT/Apache-2.0"
name = "bellman"
repository = "https://github.com/zkcrypto/bellman"
version = "0.14.0"
edition = "2021"
rust-version = "1.63"

[dependencies]
bitvec = "1"
blake2s_simd = "1"
ff = "=0.14.0-pre.0"
group = "=0.14.0-pre.0"
pairing = { version = "=0.24.0-pre.0", optional = true }
rand_core = "0.9"
byteorder = "1"
subtle = "2.2.1"

# Multicore dependencies
crossbeam-channel = { version = "0.5.1", optional = true }
lazy_static = { version = "1.4.0", optional = true }
log = { version = "0.4", optional = true }
num_cpus = { version = "1", optional = true }
rayon = { version = "1.5.1", optional = true }

[dev-dependencies]
bls12_381 = "0.8"
criterion = "0.4"
hex-literal = "0.3"
pairing = "=0.24.0-pre.0"
rand = "0.9"
rand_xorshift = "0.4"
sha2 = "0.10"

# Only for doctests.
groth16 = { path = "groth16" }

[features]
multicore = ["crossbeam-channel", "lazy_static", "log", "num_cpus", "rayon"]
default = ["multicore"]

[[bench]]
name = "slow"
harness = false

[badges]
maintenance = { status = "actively-developed" }

[patch.crates-io]
bls12_381 = { git = "https://github.com/zkcrypto/bls12_381.git", rev = "b859693951a28bb2e44515adbf54395aa8ec7a9a" }
group = { git = "https://github.com/zkcrypto/group.git", rev = "21104854da7f316c470213ab4a2ace239d24dd28" }
