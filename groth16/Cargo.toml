[package]
name = "groth16"
version = "0.1.0"
authors = [
    "Sean Bowe <ewillbefull@gmail.com>",
    "Jack Grigg <thestr4d@gmail.com>",
]
edition.workspace = true
rust-version.workspace = true
description = "Groth16 prover and verifier for Bellman"
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
bellman = { workspace = true, default-features = false }
byteorder.workspace = true
ff.workspace = true
group.workspace = true
pairing.workspace = true
rand_core.workspace = true

# Multicore dependencies
rand = { workspace = true, features = ["sys_rng"], optional = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
bls12_381.workspace = true
criterion.workspace = true
rand = { workspace = true, features = ["thread_rng"] }
subtle.workspace = true

[features]
multicore = ["bellman/multicore", "dep:rand", "dep:rayon"]
default = ["multicore"]

[[bench]]
name = "batch"
harness = false
