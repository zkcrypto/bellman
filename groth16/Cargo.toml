[package]
name = "groth16"
version = "0.1.0"
authors = [
    "Sean Bowe <ewillbefull@gmail.com>",
    "Jack Grigg <thestr4d@gmail.com>",
]
edition = "2021"
rust-version = "1.85"
description = "Groth16 prover and verifier for Bellman"
readme = "README.md"
homepage = "https://github.com/zkcrypto/bellman"
repository = "https://github.com/zkcrypto/bellman"
license = "MIT OR Apache-2.0"

[dependencies]
bellman = { version = "0.14", path = "../", default-features = false }
byteorder = "1"
ff = "0.14"
group = "0.14"
pairing = "0.24.0-pre.0"
rand_core = "0.10"

# Multicore dependencies
rand = { version = "0.10", default-features = false, features = ["sys_rng"], optional = true }
rayon = { version = "1.5.1", optional = true }

[dev-dependencies]
bls12_381 = "0.8"
criterion = "0.4"
rand = "0.10"
subtle = "2.2.1"

[features]
multicore = ["bellman/multicore", "dep:rand", "dep:rayon"]
default = ["multicore"]

[[bench]]
name = "batch"
harness = false
